name: CI Pipeline

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4   # ✅ updated

      - name: Set up Python
        uses: actions/setup-python@v5   # ✅ updated
        with:
          python-version: '3.10'        # ✅ correct version

      - name: Install dependencies
        run: |
          pip install pandas numpy scikit-learn xgboost fastapi uvicorn

      - name: Run basic test
        run: |
          python -c "print('CI pipeline working')"